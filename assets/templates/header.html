<header>
  <div class="container">
    <div class="header-left">
      <button class="menu-btn" id="rofi-trigger" title="Launch Applications">
        <img src="assets/img/logo.png" alt="Logo" class="menu-logo" />
      </button>
      <div class="divider"></div>
      <a href="index.html" class="logo-container">
        <!-- Logo Text Removed -->
      </a>
      <div class="quick-launch">
        <i class="fas fa-home ql-icon" data-target="index.html" data-title-es="Inicio" data-title-en="Home" title="Inicio"></i>
        <i class="fas fa-user ql-icon" data-target="about.html" data-title-es="Sobre Mí" data-title-en="About" title="Sobre Mí"></i>
        <i class="fas fa-code ql-icon" data-target="projects.html" data-title-es="Proyectos" data-title-en="Projects" title="Proyectos"></i>
        <i class="fas fa-envelope ql-icon" data-target="contact.html" data-title-es="Contacto" data-title-en="Contact" title="Contacto"></i>
      </div>
    </div>

    <div class="workspace-indicator">
      <span class="ws-dot active"></span>
      <span class="ws-dot"></span>
      <span class="ws-dot"></span>
      <span class="ws-dot"></span>
      <span class="ws-dot"></span>
    </div>

    <div class="header-right">
      <div class="system-tray">
        <i class="fab fa-bluetooth-b tray-icon" title="Bluetooth: Connected"></i>
        <i class="fas fa-wifi tray-icon" title="Network: Connected"></i>
        <i class="fas fa-battery-three-quarters tray-icon" title="Battery: 75%"></i>
        <span class="date-time" id="tray-clock">00:00:00</span>
      </div>
      <div class="header-controls">
        <button class="lang-toggle-btn" id="lang-toggle">ES</button>
        <button class="theme-toggle-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
      </div>
    </div>
  </div>
</header>

<!-- Rofi Menu Overlay -->
<div class="rofi-overlay" id="rofi-overlay">
  <div class="rofi-menu">
    <input type="text" class="rofi-search" placeholder="Search applications..." id="rofi-search" autofocus>
    <ul class="rofi-list">
      <li class="rofi-item" data-target="index.html">
        <i class="fas fa-home"></i> 
        <span data-es="Inicio" data-en="Home">Inicio</span>
      </li>
      <li class="rofi-item" data-target="about.html">
        <i class="fas fa-user"></i> 
        <span data-es="Sobre Mí" data-en="About">Sobre Mí</span>
      </li>
      <li class="rofi-item" data-target="projects.html">
        <i class="fas fa-code"></i> 
        <span data-es="Proyectos" data-en="Projects">Proyectos</span>
      </li>
      <li class="rofi-item" data-target="contact.html">
        <i class="fas fa-envelope"></i> 
        <span data-es="Contacto" data-en="Contact">Contacto</span>
      </li>
    </ul>
  </div>
</div>

<!-- Calendar Popup -->
<div class="calendar-popup" id="calendar-popup">
  <div class="calendar-header" id="cal-month">Mayo 2026</div>
  <div class="calendar-grid" id="cal-grid">
    <!-- Days will be generated by JS -->
  </div>
</div>
