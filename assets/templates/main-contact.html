<div class="window">
  <div class="window-header">
    <div class="window-title">
      <i class="fas fa-envelope-open-text"></i>
      <span>Thunderbird - Contact</span>
    </div>
    <div class="window-controls">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
  </div>
  <div class="window-content">
    <section class="section">
      <div class="section-header">
        <h2 data-es="Contáctame" data-en="Contact Me"><i class="fas fa-paper-plane"></i> Contáctame</h2>
      </div>

      <div class="contact-card terminal-text">
        <p class="comment"># New Message</p>
        <form class="contact-form" id="contact-form">
          <div class="form-group">
            <label><span class="prompt">></span> From:</label>
            <input type="text" name="name" placeholder="Tu Nombre / Your Name" required>
          </div>
          <div class="form-group">
            <label><span class="prompt">></span> Reply-To:</label>
            <input type="email" name="email" placeholder="tu@email.com" required>
          </div>
          <div class="form-group">
            <label><span class="prompt">></span> Message:</label>
            <textarea name="message" rows="5" placeholder="Escribe tu mensaje aquí... / Write your message here..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">
            <i class="fas fa-paper-plane"></i> Send
          </button>
        </form>
        
        <br>
        <div class="social-links">
          <a href="https://www.linkedin.com/in/deyton-riascos-ortiz-534605179" target="_blank" rel="noopener noreferrer"
            class="btn btn-secondary" style="margin: 5px;"><i class="devicon-linkedin-plain"></i> LinkedIn</a>
          <a href="https://gitlab.com/driosoft-pro" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" style="margin: 5px;"><i class="devicon-gitlab-plain"></i> GitLab</a>
          <a href="https://github.com/driosoft-pro" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" style="margin: 5px;"><i class="devicon-github-original"></i> GitHub</a>
        </div>
      </div>
    </section>
  </div>
</div>
