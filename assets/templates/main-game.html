<div class="window focused">
  <div class="window-header">
    <div class="window-title">
      <i class="fas fa-gamepad"></i>
      <span data-es="triqui.exe - deyton@driosoft" data-en="tictactoe.exe - deyton@driosoft">triqui.exe - deyton@driosoft</span>
    </div>
    <div class="window-controls">
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="dot red"></div>
    </div>
  </div>
  <div class="window-content game-container">
    <div class="terminal-header">
      <span class="prompt">deyton@driosoft:~$</span>
      <span class="command">./tictactoe.sh --vs-cpu</span>
    </div>
    
    <div id="game-status" class="terminal-text" data-es="Tu turno (X)" data-en="Your turn (X)">Tu turno (X)</div>
    
    <div class="ttt-board" id="ttt-board">
      <div class="ttt-cell" data-index="0"></div>
      <div class="ttt-cell" data-index="1"></div>
      <div class="ttt-cell" data-index="2"></div>
      <div class="ttt-cell" data-index="3"></div>
      <div class="ttt-cell" data-index="4"></div>
      <div class="ttt-cell" data-index="5"></div>
      <div class="ttt-cell" data-index="6"></div>
      <div class="ttt-cell" data-index="7"></div>
      <div class="ttt-cell" data-index="8"></div>
    </div>
    
    <div class="game-controls">
      <button id="reset-game" class="btn btn-secondary" data-es="Reiniciar Partida" data-en="Reset Game">Reiniciar Partida</button>
      <button id="cpu-start" class="btn btn-secondary" data-es="CPU inicia" data-en="CPU starts">CPU inicia</button>
    </div>

  </div>
</div>
